name: Build, validate and release GTFS

# Builds monserrate-gtfs.zip with build.py, validates it with the MobilityData
# GTFS validator and publishes it as release v<FEED_VERSION> (marked latest):
#   https://github.com/ColombiaTransit/gtfs-bogota-monserrate/releases/latest/download/monserrate-gtfs.zip
# The OpenTripPlanner pipeline (ColombiaTransit/otp-docker) reads the latest release.

on:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  schedule:
    # Monthly check on the 1st, 05:00 UTC: re-validates the feed so an
    # approaching end date (calendar.txt) shows up as a failed run.
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

concurrency:
  group: gtfs-release
  cancel-in-progress: false

permissions:
  contents: write   # publish/update the release

env:
  GTFS_VALIDATOR_VERSION: latest   # or pin, e.g. v8.0.1
  MIN_DAYS_VALID: "30"             # fail when service ends sooner than this

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build feed
        id: build
        run: |
          pip install -r requirements.txt
          python3 build.py monserrate-gtfs.zip
          version=$(python3 -c "import re; print(re.search(r'^FEED_VERSION = \"([^\"]+)\"', open('build.py').read(), re.M).group(1))")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download gtfs-validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GTFS_VALIDATOR_VERSION}" = "latest" ]; then
            URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('-cli.jar')))")
          else
            URL="https://github.com/MobilityData/gtfs-validator/releases/download/${GTFS_VALIDATOR_VERSION}/gtfs-validator-cli.jar"
          fi
          curl -fsSL -o gtfs-validator-cli.jar "$URL"

      - name: Validate
        run: |
          java -Xmx2g -jar gtfs-validator-cli.jar -i monserrate-gtfs.zip -o validation-report -c co -svu

      - name: Check validation result
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, sys
          r = json.load(open("validation-report/report.json"))
          errors = {n["code"]: n["totalNotices"] for n in r["notices"] if n["severity"] == "ERROR"}
          warnings = sum(n["totalNotices"] for n in r["notices"] if n["severity"] == "WARNING")
          end = (r["summary"].get("feedInfo") or {}).get("feedServiceWindowEnd")
          today = dt.datetime.now(dt.timezone(dt.timedelta(hours=-5))).date()
          min_days = int(os.environ["MIN_DAYS_VALID"])
          lines = [f"Errors: {sum(errors.values())}", f"Warnings: {warnings}", f"Service until: {end}"]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### GTFS validation\n\n" + "\n".join(f"- {l}" for l in lines) + "\n")
          ok = True
          if errors:
              print(f"::error::Validation errors: {errors}")
              ok = False
          if not end or dt.date.fromisoformat(end) < today + dt.timedelta(days=min_days):
              print(f"::error::Service ends {end}; update the service dates in build.py "
                    f"(needs at least {min_days} days from today)")
              ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-report
          path: validation-report/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            GTFS feed for the Monserrate funicular and cable car, built from commit
            `${{ github.sha }}` and validated with the MobilityData GTFS validator
            (see `report.html`).

            Stable download URL for the latest feed:
            https://github.com/${{ github.repository }}/releases/latest/download/monserrate-gtfs.zip
          files: |
            monserrate-gtfs.zip
            validation-report/report.json
            validation-report/report.html
